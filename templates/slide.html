<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link rel="stylesheet" href="styles.css"></head>
<!-- data-brand selecciona el preset de paleta/tipografía/logo del cliente -->
<body data-brand="navy">
<!-- Cambiar la clase l-* por el arquetipo elegido para esta slide.
     Incluir solo los scrims que correspondan a dónde cae el texto. -->
<div class="slide l-topleft">
  <img class="photo" src="foto.jpg" style="object-position:center 30%" alt="">
  <div class="tint"></div>          <!-- opcional: unificar tono en fotos claras -->
  <div class="sc-cap"></div>        <!-- backing del logo -->
  <div class="sc-top"></div>        <!-- scrim direccional según el texto -->
  <img class="logo" src="logo.png" alt="">
  <!-- ⛔ SIN PAGINADOR: ningún carrusel lleva el número de slide en la esquina
       (regla universal, el director creativo 29-jul-2026 · RUBRIC E4 · composicion §3.1).
       La cohesión la da el wordmark repetido, no un contador. -->
  <div class="text">
    <div class="eyebrow">Eyebrow / objetivo</div>
    <div class="title t-m">Título.</div>
    <div class="body">Línea de beneficio concreta, corta.</div>
  </div>
  <div class="swipe">→</div>
</div>
</body></html>
